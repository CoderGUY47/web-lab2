<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Form - Modern Gradient Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
    <style>
body {
    font-family: "Lexend", sans-serif;
    background: linear-gradient(135deg, #9b77ff 0%, #3e007e 100%);
    margin: 0;
    padding: 40px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    color: #333;
}
.form-container {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    border: 2px solid rgb(235 235 235 / 31%);
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 8px 32px rgb(255 255 255 / 19%);
    width: 100%;
    max-width: 525px;
    /* animation: fadeIn 0.5s ease-in-out; */
}
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 28px;
            font-weight: 600;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #fff;
            font-size: 14px;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 8px;
            border: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.9);
            font-size: 16px;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.5);
            background: #fff;
        }
        select {
            -webkit-appearance: none; /* Remove default arrow in WebKit browsers */
            -moz-appearance: none; /* Remove default arrow in Firefox */
            appearance: none; /* Standard property */
            background-image: url('data:image/svg+xml;utf8,<svg fill="black" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>'); /* Custom arrow */
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 16px;
            padding-right: 40px; /* Space for arrow */
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        .gender-options, .marital-options {
            display: flex;
            gap: 15px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .gender-options label, .marital-options label {
            display: flex;
            color: #fff;
            font-weight: 400;
            cursor: pointer;
            transition: color 0.3s ease;
        }
        .gender-options label:hover, .marital-options label:hover {
            color: #ddd;
        }
        .gender-options input[type="radio"], .marital-options input[type="radio"] {
            margin-right: 8px;
            vertical-align: middle;
            accent-color: #667eea;
        }
button {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, #16f9ff 0%, #2f47ff 100%);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
}
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Biodata Form</h2>
        <form id="biodataForm" action="#" method="post">
	<div>
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required>
	</div>
	<div>
            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" name="dob" required>
	</div>
	<div>
            <label>Gender</label>
            <div class="gender-options">
                <label><input type="radio" name="gender" value="male" required> Male</label>
                <label><input type="radio" name="gender" value="female" required> Female</label>
                <label><input type="radio" name="gender" value="other" required> Other</label>
            </div>
	</div>
	<div>
            <label>Marital Status</label>
            <div class="marital-options">
                <label><input type="radio" name="marital_status" value="single" required> Single</label>
                <label><input type="radio" name="marital_status" value="engaged" required> Married</label>
                <label><input type="radio" name="marital_status" value="married" required> Divorced</label>
            </div>
	</div>
	<div>
            <label for="address">Address</label>
            <textarea id="address" name="address" required></textarea>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="education">Education</label>
	    <input type="education" id="education" name="education" required>

            <label for="occupation">Occupation</label>
            <input type="text" id="occupation" name="occupation">

            <label for="comments">Additional Comments</label>
            <textarea id="comments" name="comments"></textarea>
	</div>
            <button type="submit">Submit Biodata</button>
        </form>
    </div>
</body>
</html>
